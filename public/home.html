<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kev-tts · Home</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C7B'/%3E%3Cpath d='M6 16h2m4-6v12m4-9v6m4-10v14m4-9v4' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"><style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#5b6573;--bd:#e2e6ec;--ac:#0e7c7b;--ac2:#fff;--code:#eef1f5}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8ecf2;--mut:#98a2b3;--bd:#262c36;--ac:#2cc4c2;--ac2:#06201f;--code:#1e242d}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:860px;margin:0 auto;padding:20px 16px 60px}
nav{display:flex;gap:6px;align-items:center;padding:14px 0;flex-wrap:wrap}
nav b{margin-right:auto;font-size:18px}nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:8px}
nav a:hover,nav a.on{background:var(--card);color:var(--tx);border:0}
h1{font-size:26px;margin:.4em 0 .2em}h2{font-size:19px;margin:1.8em 0 .5em}p{margin:.5em 0}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px 0}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}
button,.btn{background:var(--ac);color:var(--ac2);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:var(--code);color:var(--tx)}button:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 180px}.row>button{flex:0 0 auto}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--code);border-radius:6px}
code{padding:2px 6px;word-break:break-all}pre{padding:12px;overflow-x:auto;margin:8px 0}pre code{padding:0;background:none}
.url{display:flex;gap:8px}.url input{font-family:ui-monospace,monospace;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
.tbl{overflow-x:auto}.msg{margin-top:10px;font-size:13px}.err{color:#d6453d}.ok{color:var(--ac)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--code);border:1px solid var(--bd);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--tx)}
.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
footer{margin-top:40px;text-align:center;color:var(--mut);font-size:13px}footer a{color:var(--ac);font-weight:600;text-decoration:none}
</style></head><body><div class="w"><nav><b>kev-tts</b><a href="/home" class="on">Home</a><a href="/docs" class="">Docs</a><a href="/voices">Voices</a><a href="/status">Status</a></nav>
<h1>Teks jadi suara</h1>
<p class="mut">Pilih suara, ketik teks, dengarkan, lalu salin URL siap pakai.</p>
<div class="card">
  <label for="v">Suara</label><select id="v"></select>
  <label for="t">Teks</label><textarea id="t" maxlength="1000">Konnichiwa! Watashi wa kevsoft desu.</textarea>
  <label><input type="checkbox" id="f" style="width:auto;margin-right:6px">Mode kilat (suara biasa, ~1 detik, bukan suara clone)</label>
  <div class="row" style="margin-top:12px"><button id="go">Putar suara</button><span id="st" class="msg mut"></span></div>
  <audio id="a" controls style="width:100%;margin-top:12px;display:none"></audio>
</div>
<div class="card">
  <b>URL untuk dipakai</b>
  <div class="url" style="margin-top:8px"><input id="u" readonly><button class="g" id="cp">Salin</button></div>
  <p class="mut msg">Ganti nilai <code>text=</code> dengan teks apa saja. Tambah <code>&amp;fast=1</code> untuk mode kilat.</p>
</div>
<div class="card">
  <b>Semua suara</b> <span id="n" class="mut"></span>
  <div id="list" class="chips" style="margin-top:10px"></div>
</div>
<p class="mut">Cara pasang & parameter lengkap ada di <a href="/docs" style="color:var(--ac)">Docs</a>.</p>
<footer>powered by <a href="https://github.com/kevsoftstudio" target="_blank" rel="noopener">kevsoft-studio</a></footer></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},voices=[],cur=null;
function path(v){return v.default?'/animemoe':'/'+v.id}
function url(){var v=cur||{id:'sample',default:true},q='?text='+encodeURIComponent($('t').value||'halo');
 if($('f').checked)q+='&fast=1';return location.origin+path(v)+q}
function sync(){$('u').value=url();}
function pick(id){cur=voices.filter(function(x){return x.id===id})[0]||voices[0]||null;
 if(cur)$('v').value=cur.id;[].forEach.call($('list').children,function(c){c.className='chip'+(cur&&c.dataset.id===cur.id?' on':'')});sync()}
function draw(){var s=$('v'),l=$('list');s.innerHTML='';l.innerHTML='';
 voices.forEach(function(v){var o=document.createElement('option');o.value=v.id;o.textContent=v.id+(v.default?' (utama)':'');s.appendChild(o);
  var c=document.createElement('button');c.type='button';c.className='chip';c.dataset.id=v.id;c.textContent=v.id;c.onclick=function(){pick(v.id)};l.appendChild(c)});
 $('n').textContent='('+voices.length+')';pick(voices[0]&&voices[0].id)}
fetch('/voices').then(function(r){return r.json()}).then(function(j){voices=(j&&j.voices)||[];if(!voices.length)throw 0;draw()})
 .catch(function(){voices=[{id:'sample',default:true}];draw()});
$('v').onchange=function(){pick(this.value)};$('t').oninput=sync;$('f').onchange=sync;
$('cp').onclick=function(){var u=$('u');u.select();try{navigator.clipboard.writeText(u.value)}catch(e){document.execCommand('copy')}$('cp').textContent='Tersalin';setTimeout(function(){$('cp').textContent='Salin'},1200)};
$('go').onclick=function(){var b=this,st=$('st'),t0=Date.now();b.disabled=true;st.className='msg mut';st.textContent='Memproses…';
 fetch(url()).then(function(r){var ct=r.headers.get('content-type')||'';
  if(!r.ok||ct.indexOf('audio')!==0)return r.json().catch(function(){return{}}).then(function(j){throw new Error(j.message||('HTTP '+r.status))});
  var eng=r.headers.get('x-tts-engine'),ca=r.headers.get('x-tts-cache');
  return r.blob().then(function(bl){return{bl:bl,eng:eng,ca:ca}})})
 .then(function(o){var a=$('a');a.src=URL.createObjectURL(o.bl);a.style.display='block';a.play().catch(function(){});
  st.className='msg ok';st.textContent='Selesai '+((Date.now()-t0)/1000).toFixed(1)+' dtk · '+(o.eng||'')+(o.ca&&o.ca!=='none'?' · cache':'')})
 .catch(function(e){st.className='msg err';st.textContent='Gagal: '+e.message+' — coba lagi.'})
 .then(function(){b.disabled=false})};
})();
</script></body></html>
